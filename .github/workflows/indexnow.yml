name: IndexNow

on:
  push:
    branches:
      - main
    paths:
      - "sitemap.xml"
      - "*.html"
      - "**/*.html"
      - "data/**"
      - "posts/**"
      - "content/**"
      - "scripts/**"
      - "build.mjs"
      - ".github/workflows/indexnow.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify-indexnow:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Avisar a IndexNow usando el sitemap
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          import xml.etree.ElementTree as ET

          key = os.environ.get("INDEXNOW_KEY", "").strip()
          if not key:
              raise SystemExit("Falta el secreto INDEXNOW_KEY en Settings > Secrets and variables > Actions.")

          with open("sitemap.xml", "rb") as f:
              root = ET.fromstring(f.read())

          ns = {"sm": "http://www.sitemaps.org/schemas/sitemap/0.9"}
          urls = [node.text.strip() for node in root.findall(".//sm:loc", ns) if node.text and node.text.strip()]
          if not urls:
              raise SystemExit("No se encontraron URL en sitemap.xml.")

          payload = {
              "host": "imagenesypostales.com",
              "key": key,
              "keyLocation": f"https://imagenesypostales.com/{key}.txt",
              "urlList": urls
          }
          request = urllib.request.Request(
              "https://api.indexnow.org/indexnow",
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json; charset=utf-8"},
              method="POST"
          )
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  print(f"IndexNow respondió HTTP {response.status}. Se enviaron {len(urls)} URL del sitemap.")
          except Exception as exc:
              if hasattr(exc, "read"):
                  print(exc.read().decode("utf-8", "replace"))
              raise
          PY
