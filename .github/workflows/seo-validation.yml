name: Validación SEO

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Comprobar sintaxis Python
        run: python -m py_compile scripts/build_content.py scripts/update_navigation.py
      - name: Validar catálogos JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in [Path("data/citas-celebres.json"), Path("data/frases.json"), Path("data/postales.json")]:
              if path.exists():
                  json.loads(path.read_text(encoding="utf-8"))
                  print(f"JSON válido: {path}")
          PY
      - name: Validar sitemap y páginas de herramientas
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          import xml.etree.ElementTree as ET

          sitemap = Path("sitemap.xml")
          root = ET.fromstring(sitemap.read_text(encoding="utf-8"))
          ns = {"sm": "http://www.sitemaps.org/schemas/sitemap/0.9"}
          urls = [node.text for node in root.findall(".//sm:loc", ns)]
          if len(urls) != len(set(urls)):
              raise SystemExit("ERROR: el sitemap contiene URL duplicadas")
          missing = []
          for url in urls:
              path = url.removeprefix("https://imagenesypostales.com/")
              local = Path(path) / "index.html" if path else Path("index.html")
              if not local.exists():
                  missing.append((url, str(local)))
          if missing:
              for url, local in missing:
                  print(f"URL sin archivo local: {url} -> {local}")
              raise SystemExit(1)
          tools = [
              "herramientas/index.html",
              "herramientas/comprimir-imagenes/index.html",
              "herramientas/convertir-imagen/index.html",
              "herramientas/generador-favicon/index.html",
              "herramientas/girar-imagen/index.html",
              "herramientas/marca-de-agua/index.html",
              "herramientas/quitar-fondo/index.html",
              "herramientas/recortar-imagen/index.html",
              "herramientas/redimensionar-imagenes/index.html",
              "herramientas/texto-en-imagen/index.html",
          ]
          for name in tools:
              html = Path(name).read_text(encoding="utf-8")
              for label, pattern in [
                  ("title", r"<title[^>]*>.+?</title>"),
                  ("meta description", r'<meta\s+name=["\\']description["\\']\s+content=["\\'][^"\\']+'),
                  ("canonical", r'<link\s+rel=["\\']canonical["\\']\s+href=["\\']https://imagenesypostales\\.com/'),
                  ("H1", r"<h1\\b"),
                  ("JSON-LD", r'application/ld\\+json'),
              ]:
                  if not re.search(pattern, html, re.I | re.S):
                      raise SystemExit(f"Falta {label} en {name}")
          print(f"Sitemap válido: {len(urls)} URL únicas; {len(tools)} páginas de herramientas comprobadas.")
          PY
