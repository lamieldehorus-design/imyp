name: Validación SEO

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar conversor de imagen social
        run: pip install cairosvg
      - name: Comprobar sintaxis Python
        run: python -m py_compile scripts/build_content.py scripts/build_social_image.py scripts/update_navigation.py
      - name: Validar catálogos JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in [Path("data/citas-celebres.json"), Path("data/frases.json"), Path("data/postales.json")]:
              if path.exists():
                  json.loads(path.read_text(encoding="utf-8"))
                  print(f"JSON válido: {path}")
          PY
      - name: Regenerar contenido y sitemap desde el estado actual del sitio
        run: |
          python scripts/build_content.py
          python scripts/build_social_image.py
          python scripts/update_navigation.py
      - name: Validar sitemap y páginas de herramientas
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          import xml.etree.ElementTree as ET

          sitemap = Path("sitemap.xml")
          root = ET.fromstring(sitemap.read_text(encoding="utf-8"))
          ns = {"sm": "http://www.sitemaps.org/schemas/sitemap/0.9"}
          urls = [node.text for node in root.findall(".//sm:loc", ns)]
          if len(urls) != len(set(urls)):
              raise SystemExit("ERROR: el sitemap contiene URL duplicadas")
          missing = []
          for url in urls:
              path = url.removeprefix("https://imagenesypostales.com/")
              local = Path(path) / "index.html" if path else Path("index.html")
              if not local.exists():
                  missing.append((url, str(local)))
          if missing:
              for url, local in missing:
                  print(f"URL sin archivo local: {url} -> {local}")
              raise SystemExit(1)

          # Comprobar integridad: todas las páginas HTML publicables deben estar en el sitemap.
          excluded_html = {"google939990971c7be018.html", "pinterest-4667b.html"}
          expected_urls = set()
          for page in Path(".").rglob("*.html"):
              rel = page.as_posix().removeprefix("./")
              if rel in excluded_html or rel.startswith(".git/"):
                  continue
              if rel == "index.html":
                  path = "/"
              elif rel.endswith("/index.html"):
                  path = "/" + rel.removesuffix("index.html")
              else:
                  path = "/" + rel
              expected_urls.add("https://imagenesypostales.com" + path)

          actual_urls = set(urls)
          absent = sorted(expected_urls - actual_urls)
          unexpected = sorted(actual_urls - expected_urls)
          if absent:
              print("Páginas HTML publicables ausentes del sitemap:")
              for url in absent:
                  print(f"  - {url}")
          if unexpected:
              print("URL del sitemap sin correspondencia en el inventario publicable:")
              for url in unexpected:
                  print(f"  - {url}")
          if absent or unexpected:
              raise SystemExit(1)
          tools = [
              "herramientas/index.html",
              "herramientas/comprimir-imagenes/index.html",
              "herramientas/convertir-imagen/index.html",
              "herramientas/generador-favicon/index.html",
              "herramientas/girar-imagen/index.html",
              "herramientas/marca-de-agua/index.html",
              "herramientas/quitar-fondo/index.html",
              "herramientas/recortar-imagen/index.html",
              "herramientas/redimensionar-imagenes/index.html",
              "herramientas/texto-en-imagen/index.html",
          ]
          for name in tools:
              page = Path(name).read_text(encoding="utf-8")
              checks = [
                  ("title", r"<title[^>]*>.+?</title>"),
                  ("meta description", r"<meta\s+name=\"description\"\s+content=\"[^\"]+"),
                  ("canonical", r"<link\s+rel=\"canonical\"\s+href=\"https://imagenesypostales\.com/"),
                  ("H1", r"<h1\b"),
                  ("JSON-LD", r"application/ld\+json"),
              ]
              for label, pattern in checks:
                  if not re.search(pattern, page, re.I | re.S):
                      raise SystemExit(f"Falta {label} en {name}")
          print(f"Sitemap íntegro: {len(urls)} URL únicas y todas las páginas HTML publicables incluidas; {len(tools)} páginas de herramientas comprobadas.")
          PY
      - name: Comprobar enlaces internos en todas las páginas HTML
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          from urllib.parse import unquote, urlsplit

          SITE_HOST = "imagenesypostales.com"
          errors = []
          checked_links = 0
          checked_pages = 0

          for page_path in Path(".").rglob("*.html"):
              if any(part.startswith(".") for part in page_path.parts[:-1]):
                  continue
              page = page_path.read_text(encoding="utf-8", errors="ignore")
              checked_pages += 1
              for href in re.findall(r"""\\bhref\\s*=\\s*["']([^"']+)["']""", page, re.I):
                  href = href.strip()
                  if not href or href.startswith("#") or re.match(r"^(?:mailto:|tel:|javascript:|data:|blob:)", href, re.I):
                      continue
                  parsed = urlsplit(href)
                  if parsed.scheme and parsed.scheme.lower() not in ("http", "https"):
                      continue
                  if parsed.netloc and parsed.netloc.lower() not in (SITE_HOST, "www." + SITE_HOST):
                      continue
                  if parsed.netloc and parsed.path == "" and parsed.query:
                      continue

                  raw_path = unquote(parsed.path)
                  if not raw_path:
                      target = Path("index.html") if parsed.netloc or href.startswith("/") else page_path
                  elif raw_path.startswith("/"):
                      target = Path(raw_path.lstrip("/"))
                  else:
                      target = page_path.parent / raw_path

                  if str(target).endswith("/"):
                      target = target / "index.html"
                  elif not target.suffix:
                      target = target / "index.html"

                  checked_links += 1
                  if not target.is_file():
                      errors.append(f"{page_path}: enlace interno sin archivo: {href} -> {target}")

          if errors:
              print("\\n".join("ERROR: " + error for error in errors))
              raise SystemExit(f"Auditoría de enlaces fallida: {len(errors)} enlace(s) roto(s) en {checked_pages} páginas.")
          print(f"Enlaces internos correctos: {checked_links} destinos comprobados en {checked_pages} páginas HTML.")
          PY
      - name: Auditoría SEO técnica de todas las páginas publicables
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          import xml.etree.ElementTree as ET

          SITE = "https://imagenesypostales.com"
          excluded = {"google939990971c7be018.html", "pinterest-4667b.html"}
          sitemap_root = ET.fromstring(Path("sitemap.xml").read_text(encoding="utf-8"))
          ns = {"sm": "http://www.sitemaps.org/schemas/sitemap/0.9"}
          sitemap_urls = {node.text for node in sitemap_root.findall(".//sm:loc", ns)}

          def has_meta(page, key, attr="name"):
              return bool(re.search(
                  rf'<meta\b(?=[^>]*{attr}=["\']{re.escape(key)}["\'])',
                  page, re.I
              ))

          errors = []
          pages = []
          canonicals = {}
          for path in Path(".").rglob("*.html"):
              rel = path.as_posix().removeprefix("./")
              if rel in excluded or any(part.startswith(".") for part in path.parts[:-1]):
                  continue
              page = path.read_text(encoding="utf-8", errors="ignore")
              title = re.search(r"<title\b[^>]*>(.*?)</title>", page, re.I | re.S)
              description = has_meta(page, "description")
              canonical = re.search(r'<link\b(?=[^>]*rel=["\']canonical["\'])[^>]*href=["\']([^"\']+)["\']', page, re.I)
              h1_count = len(re.findall(r"<h1\b", page, re.I))
              label = rel
              if not title or not re.sub(r"<[^>]+>", "", title.group(1)).strip():
                  errors.append(f"{label}: falta title")
              if not description:
                  errors.append(f"{label}: falta meta description")
              if not canonical:
                  errors.append(f"{label}: falta canonical")
              else:
                  url = canonical.group(1)
                  if not url.startswith(SITE + "/") and url != SITE + "/":
                      errors.append(f"{label}: canonical fuera del dominio canónico: {url}")
                  canonicals.setdefault(url, []).append(label)
              if h1_count != 1:
                  errors.append(f"{label}: debe tener exactamente un H1; tiene {h1_count}")
              for key, attr in [("robots", "name"), ("og:title", "property"), ("og:description", "property"), ("og:url", "property"), ("twitter:card", "name")]:
                  if not has_meta(page, key, attr):
                      errors.append(f"{label}: falta metadato {key}")
              if not re.search(r'<script\b[^>]*type=["\']application/ld\+json["\']', page, re.I):
                  errors.append(f"{label}: falta JSON-LD")

              # Auditoría de imágenes: texto alternativo, rutas locales y vista social.
              for img_tag in re.findall(r"<img\b[^>]*>", page, re.I):
                  src_match = re.search(r"""\bsrc=["']([^"']+)["']""", img_tag, re.I)
                  alt_match = re.search(r"""\balt=["']([^"']*)["']""", img_tag, re.I)
                  if src_match and not alt_match:
                      errors.append(f"{label}: imagen sin atributo alt: {src_match.group(1)}")
                  if src_match:
                      src = src_match.group(1).strip()
                      if src and not re.match(r"^(?:https?:|//|data:|blob:|#)", src, re.I):
                          clean_src = src.split("#", 1)[0].split("?", 1)[0]
                          target = Path(clean_src.lstrip("/")) if clean_src.startswith("/") else Path(rel).parent / clean_src
                          if not target.is_file():
                              errors.append(f"{label}: ruta de imagen inexistente: {src}")
              og_image = re.search(r'<meta\b(?=[^>]*property=["\']og:image["\'])[^>]*content=["\']([^"\']+)["\']', page, re.I)
              if not og_image:
                  errors.append(f"{label}: falta og:image")
              elif og_image.group(1).startswith(SITE + "/"):
                  image_path = og_image.group(1)[len(SITE) + 1:].split("#", 1)[0].split("?", 1)[0]
                  if not Path(image_path).is_file():
                      errors.append(f"{label}: og:image apunta a un archivo inexistente: {image_path}")
              if not re.search(r'<meta\b(?=[^>]*name=["\']twitter:image["\'])', page, re.I):
                  errors.append(f"{label}: falta twitter:image")
              if canonical and has_meta(page, "robots"):
                  robots = re.search(r'<meta\b(?=[^>]*name=["\']robots["\'])[^>]*content=["\']([^"\']*)["\']', page, re.I)
                  if robots and "noindex" in robots.group(1).lower() and canonical.group(1) in sitemap_urls:
                      errors.append(f"{label}: página noindex incluida en sitemap")
              pages.append(label)

          for url, sources in canonicals.items():
              if len(sources) > 1:
                  errors.append(f"Canonical duplicado {url}: {', '.join(sources)}")

          if errors:
              print("\n".join("ERROR: " + error for error in errors))
              raise SystemExit(f"Auditoría SEO fallida: {len(errors)} problema(s) en {len(pages)} páginas.")
          print(f"Auditoría SEO técnica correcta: {len(pages)} páginas comprobadas; title, description, canonical, un H1, robots, Open Graph, Twitter Card y JSON-LD; sin canonicals duplicados.")
          PY
