name: Separar CSS crítico en todas las páginas

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  defer-css:
    if: "!contains(github.event.head_commit.message, '[skip css defer]')"
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Separar CSS no crítico y conservar fallback
        run: python scripts/defer-css-all-pages.py
      - name: Guardar cambios de todas las páginas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '**/*.html'
          if git diff --cached --quiet; then
            echo "No hay cambios de CSS pendientes."
            exit 0
          fi
          git commit -m "perf: diferir CSS no crítico en todas las páginas [skip css defer]"
          git push origin main
