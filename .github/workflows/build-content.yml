name: Compilar contenido TXT

on:
  # Cualquier cambio en main vuelve a compilar el contenido y sincronizar el sitemap.
  # El segundo push del bot no genera otro commit si no hay nada nuevo que producir.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar conversor de imagen social
        run: pip install cairosvg
      - name: Compilar frases, blog, postales y sitemap
        run: python scripts/build_content.py
      - name: Generar imagen social PNG compatible
        run: python scripts/build_social_image.py
      - name: Añadir enlaces legales en todas las páginas
        run: python scripts/update_navigation.py
      - name: Guardar archivos generados
        run: |
          git config user.name "imagenesypostales-bot"
          git config user.email "actions@users.noreply.github.com"
          # Otros workflows también actualizan HTML en main. En cada intento se
          # parte de la versión más reciente y se regeneran los archivos para evitar conflictos.
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python scripts/build_content.py
            python scripts/build_social_image.py
            python scripts/update_navigation.py
            python .github/scripts/inject_statcounter.py
            python scripts/defer-css-all-pages.py
            git add -A
            if git diff --cached --quiet; then
              echo "Sin cambios generados"
              exit 0
            fi
            git commit -m "Actualizar contenido desde TXT"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push rechazado; se regenerará sobre main ($attempt/3)"
          done
          echo "No se pudieron publicar los archivos generados tras 3 intentos."
          exit 1
