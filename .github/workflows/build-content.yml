name: Compilar contenido TXT

on:
  push:
    branches: [main]
    paths:
      - "data/frases.txt"
      - "data/blog.txt"
      - "data/postales.txt"
      - "scripts/build_content.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compilar frases, blog, postales y sitemap
        run: python scripts/build_content.py
      - name: Guardar archivos generados
        run: |
          git config user.name "imagenesypostales-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/frases.json data/blog.json data/postales.json blog postales sitemap.xml
          if git diff --cached --quiet; then
            echo "Sin cambios generados"
          else
            git commit -m "Actualizar contenido desde TXT"
            git push
          fi
